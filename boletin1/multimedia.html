<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>multimedia</title>
</head>
<body>
<iframe width="560" height="315" src="https://www.youtube.com/embed/WSFT4OQF_mA?si=yFeDe-VJwP9OgFlc" title="Vídeo tutorial de HTML5" loading="lazy"></iframe>
<embed src="media/apuntes.pdf" type="application/pdf" width="100%" height="500px"></embed>
<object data="[https://www.wikipedia.org](https://www.wikipedia.org)" type="text/html">Tu navegador no admite la visualización de este objeto incrustado</object>

<section id="seccion-2">



    <video controls width="640" poster="media/portada.jpg">
        <source src="media/muestra.mp4" type="video/mp4">
        Tu navegador no soporta la reproducción de vídeo HTML5.
    </video>


    <audio controls>
        <source src="media/pista.mp3" type="audio/mpeg">
        <source src="media/pista.ogg" type="audio/ogg">
        Tu navegador no soporta la reproducción de audio HTML5.
    </audio>
</section>

<!-- SECCIÓN 3 -->
<section id="seccion-3">



    <svg width="200" height="200">
        <rect width="200" height="200" fill="blue" />
        <circle cx="100" cy="100" r="60" fill="yellow" stroke="red" stroke-width="5" />
    </svg>


    <canvas id="miLienzo" width="300" height="150">
        Tu navegador no soporta el elemento Canvas
    </canvas>
</section>

<script>
    const canvas = document.getElementById('miLienzo');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'green';
    ctx.fillRect(10, 10, 150, 80);
    ctx.moveTo(0, 0);
    ctx.lineTo(200, 100);
    ctx.stroke();
</script>

</body>
</html>
