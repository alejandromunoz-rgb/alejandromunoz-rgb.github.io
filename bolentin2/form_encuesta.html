<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>form_encuesta.html</title>
</head>
<body>

<form action="https://lm.ciclo.iesnervion.es/encuesta.php" method="POST"></form>
    <fieldset>
        <legend>Encuesta</legend>
        <label for="Nombre y Apellidos">Nombre y Apellidos: </label>
        <input name="Nombre y Apellidos" id="Nombre y Apellidos" type="text" required placeholder ="Nombre y Apellidos" >
        <br>

        <select name="formación" id="formación">

            <option value="value1">DAM<option>
            <option value="value2" selected>DAW<option>
            <option value="value3" selected>ASIR<option>
        </select>
        </br>

        <br>
        <input name="lenguaje" type="radio" value="Java"> Java
        <input name="lenguaje" type="radio" value="C#"> C#
        <input name="lenguaje" type="radio" value="Phyton"> Phyton
        <input name="lenguaje" type="radio" value="JavaScript"> JavaScript
        </br>

        <br>
        <input name="S.O" type="checkbox" value="Windows"> Windows
        <input name="S.O" type="checkbox" value="Linux"> Linux
        <input name="S.O" type="checkbox" value="macOS"> macOS
        </br>

        <br>
        <label for="Comentario">Escribe tu mensaje: </label>
        <textarea rows="4" cols="40" placeholder="Comentario" id="Comentario" name="Comentario" ></textarea>
        </br>

        <br>
        <button type="submit"> Enviar </button>
        <button type="reset">  Vuelve a Empezar </button>
        </br>

    </fieldset>
</body>
</html>
